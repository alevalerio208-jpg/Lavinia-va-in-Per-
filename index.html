:root{--shell:#efe9df;--shell2:#ddd4c6;--shellEdge:#c9bfae;--bezel:#4d5166;--bezel2:#3e4254;--navy:#2c3a7a;--ab:#b0285e;--ab2:#7c1740;--key:#2b2a30;--ink:#f3ead8;--gold:#e8c860;--px:"Press Start 2P",ui-monospace,monospace;color-scheme:light}
[hidden]{display:none!important}

body{background:linear-gradient(170deg,#ffcf9e 0%,#f7a98a 38%,#c99bc8 75%,#9d8ccc 100%);font-family:var(--px);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}

 border-radius:22px 22px 64px 22px;
 background:radial-gradient(140% 60% at 30% 0%,rgba(255,255,255,.55),transparent 60%),repeating-linear-gradient(45deg,rgba(0,0,0,.012) 0 2px,rgba(255,255,255,.012) 2px 4px),linear-gradient(175deg,var(--shell),var(--shell2));
 box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -5px 0 var(--shellEdge),inset 4px 0 10px rgba(255,255,255,.35),inset -6px -8px 16px rgba(120,100,80,.12),0 14px 30px rgba(80,40,60,.35)}
#console::before{content:"";position:absolute;left:18px;right:18px;top:6px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08) 10%,rgba(0,0,0,.08) 90%,transparent)}
#screenWrap{position:relative;background:linear-gradient(180deg,var(--bezel),var(--bezel2));border-radius:10px 10px 36px 10px;padding:22px 10px 12px 24px;display:flex;flex-direction:column;min-height:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.7)}
#screenWrap .stripe{position:absolute;left:12px;right:12px;top:9px;display:flex;align-items:center;gap:6px;font:6px var(--px);color:#c9cbe0;letter-spacing:.08em;white-space:nowrap}
#screenWrap .stripe i{flex:1;height:2px;background:#9a2c48;box-shadow:0 3px 0 #e0b84a}
#screenWrap .led{position:absolute;left:8px;top:46%;width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 6px 2px rgba(255,60,60,.65),inset 0 -2px 2px rgba(0,0,0,.3)}
#screenWrap .led::after{content:"POWER";position:absolute;left:50%;top:13px;transform:translateX(-50%);font:5px var(--px);color:#a8abc4;letter-spacing:.05em}
#screenWrap.blink .led{background:#ffd23b;box-shadow:0 0 8px 3px rgba(255,210,60,.7)}
#screenBox{position:relative;flex:1;min-height:0;min-width:0;display:grid;place-items:center;overflow:hidden}
@media (orientation:portrait){#screenBox{flex:none}}
#screen{display:block;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;cursor:pointer;border-radius:3px;box-shadow:0 0 0 2px #23252f,0 0 0 3px rgba(255,255,255,.06)}
#screenBox::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 28%,transparent 29%);border-radius:3px}

/* D-pad: plastic cross that tilts toward the pressed direction */
.dpad{position:relative;width:144px;height:144px;flex:none;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.10) 0 58%,transparent 60%);transition:transform .06s}
.dpad .cross{position:absolute;inset:6px;transition:transform .06s ease-out;transform-style:preserve-3d}
.dpad[data-tilt=up] .cross{transform:perspective(260px) rotateX(10deg)}
.dpad[data-tilt=down] .cross{transform:perspective(260px) rotateX(-10deg)}
.dpad[data-tilt=left] .cross{transform:perspective(260px) rotateY(-10deg)}
.dpad[data-tilt=right] .cross{transform:perspective(260px) rotateY(10deg)}
.dpad button{position:absolute;width:44px;height:44px;background:linear-gradient(180deg,#3a3940,var(--key));border:0;color:#57565f;font:10px var(--px);cursor:pointer;box-shadow:0 4px 0 #121116;padding:0}
.dpad .c{position:absolute;left:44px;top:44px;width:44px;height:44px;background:linear-gradient(180deg,#36353c,var(--key));box-shadow:0 4px 0 #121116}
.dpad .c::after{content:"";position:absolute;left:13px;top:13px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#1c1b20,#323138);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
#pad-up{left:44px;top:0;border-radius:5px 5px 0 0}#pad-down{left:44px;bottom:0;border-radius:0 0 5px 5px}#pad-left{left:0;top:44px;border-radius:5px 0 0 5px}#pad-right{right:0;top:44px;border-radius:0 5px 5px 0}
.dpad button.down{color:#8e8c98;background:linear-gradient(180deg,#2a2930,#1f1e24)}
/* A / B: glossy round buttons in a recessed well */
.ab{display:flex;gap:16px;align-items:center;transform:rotate(-24deg);padding:8px 10px;border-radius:48px;background:rgba(0,0,0,.07);box-shadow:inset 0 2px 4px rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.7)}
.ab button{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#e0609a 0%,var(--ab) 45%,var(--ab2) 100%);border:0;color:rgba(255,230,240,.85);font:12px var(--px);box-shadow:0 5px 0 #5a1030,0 8px 10px rgba(80,20,40,.3),inset 0 2px 0 rgba(255,255,255,.35);cursor:pointer;transition:transform .05s,box-shadow .05s}
.ab button::after{content:attr(aria-label);position:absolute;left:50%;bottom:-20px;transform:translateX(-50%) rotate(24deg);font:9px var(--px);color:var(--navy)}
#btnB{margin-top:30px}
.ab button.down{transform:translateY(4px);box-shadow:0 1px 0 #5a1030,0 2px 3px rgba(80,20,40,.3),inset 0 3px 6px rgba(0,0,0,.25);filter:brightness(.93)}
/* START/SELECT-style rubber pills */
.mid{grid-area:mid;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px 12px;align-items:flex-start;min-width:0}
.dpad{grid-area:dpad}.ab{grid-area:ab;margin-right:8px}
.pill{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:4px 2px;font:7px var(--px);color:var(--navy);cursor:pointer;white-space:nowrap;letter-spacing:.04em}
.pill::before{content:"";display:block;width:42px;height:11px;border-radius:7px;background:linear-gradient(180deg,#a5a2ad,#7b7884);box-shadow:0 3px 0 #55535c,inset 0 1px 0 rgba(255,255,255,.45);transform:rotate(-22deg);transition:transform .05s,box-shadow .05s}
.pill.on::before{background:linear-gradient(180deg,#f3d877,#d6ac3a);box-shadow:0 3px 0 #8a6a1e,inset 0 1px 0 rgba(255,255,255,.6),0 0 8px rgba(240,200,80,.6)}
.pill.down::before{transform:rotate(-22deg) translateY(2px);box-shadow:0 1px 0 #55535c,inset 0 2px 3px rgba(0,0,0,.25)}
.pill:focus-visible,.ab button:focus-visible,.dpad button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.speaker{position:absolute;right:30px;bottom:34px;display:flex;gap:6px;transform:rotate(-28deg);pointer-events:none}
.speaker i{display:block;width:5px;height:38px;border-radius:3px;background:linear-gradient(180deg,#b7ad9c,#cfc6b6);box-shadow:inset 0 2px 3px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.8)}
.help{display:none}
@media (max-height:700px) and (orientation:portrait){.speaker{display:none}.logo{display:none}}
@media (orientation:landscape){#console{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:1fr;align-items:center;border-radius:26px;padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 46px)} #controls{padding-bottom:0!important}
  #controls{display:contents}.dpad{grid-column:1;grid-row:1}.ab{grid-column:3;grid-row:1}#screenWrap{grid-column:2;grid-row:1;height:100%;box-sizing:border-box}.mid{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);flex-direction:row}.help{display:none}.brand{display:none}.logo{display:none}.speaker{display:none}#screenWrap .stripe{font-size:5px}}
#endScreen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,16,.86);text-align:center;padding:0 24px}
#endScreen h2{font:18px/1.5 var(--px);color:var(--gold);margin:0 0 14px}
#endScreen p{font:10px/1.8 var(--px);color:var(--ink);max-width:36ch;margin:0 auto 20px}
#endScreen button{font:11px var(--px);background:var(--gold);color:#201a10;border:0;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #6a5420}

/* ---- telefono in verticale: la console occupa tutto lo schermo e si adatta ---- */

 .mid{padding-right:36px}

}

<script>
// ===================== LAVI — handheld-style RPG prototype =====================
(function(){
const TS=16,W=240,H=160,VW=15,VH=10;
const view=document.getElementById('screen');const vctx=view.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const ctx=buf.getContext('2d');
const FONT='8px "Press Start 2P", monospace';
function fit(){const box=document.getElementById('screenBox');view.style.width='1px';view.style.height='1px';void box.offsetWidth;const land=innerWidth>innerHeight;const ctl=document.getElementById('controls'),lg=document.querySelector('.logo');const used=Math.max(300,innerHeight*0.42);const bw=box.clientWidth,bh=land?box.clientHeight:Math.max(160,innerHeight-used);let s=Math.min(bw/W,bh/H);s=s>=2?Math.floor(s):Math.max(1,s);view.width=W*Math.ceil(s);view.height=H*Math.ceil(s);view.style.width=Math.round(W*s)+'px';view.style.height=Math.round(H*s)+'px';vctx.imageSmoothingEnabled=false;}
function refit(){fit();requestAnimationFrame(fit);[80,250,500,900].forEach(ms=>setTimeout(fit,ms));}addEventListener('resize',refit);addEventListener('orientationchange',refit);if(window.visualViewport)visualViewport.addEventListener('resize',refit);
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0);};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

function dk(hex,a=-30){const n=parseInt(hex.slice(1),16);let r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,((n>>8)&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

// ---------- tiles (16x16, bold outlines, bright limited palette) ----------
const TILE={};
function tile(key,fn){const c=mk(TS,TS);fn(c.getContext('2d'));TILE[key]=c;}
function grass(c,v){R(c,0,0,16,16,'#88d070');R(c,2+v,3,1,2,'#58a048');R(c,3+v,2,1,1,'#58a048');R(c,10-v,9,1,2,'#58a048');R(c,11-v,8,1,1,'#58a048');R(c,6,13,1,1,'#a8e090');}
tile('G',c=>grass(c,0));tile('g',c=>grass(c,2));
tile('F',c=>{grass(c,1);[[3,4,'#f86878'],[11,6,'#f8e060'],[6,11,'#f8f8f8'],[12,12,'#f86878']].forEach(([x,y,col])=>{R(c,x-1,y,3,1,col);R(c,x,y-1,1,3,col);R(c,x,y,1,1,'#f8c030');});});
tile('P',c=>{R(c,0,0,16,16,'#e8d0a0');R(c,3,4,2,1,'#d0b080');R(c,11,10,2,1,'#d0b080');R(c,7,13,1,1,'#d0b080');});
tile('C',c=>{R(c,0,0,16,16,'#b8b0a0');for(let y=0;y<16;y+=4)for(let x=(y/4)%2*4;x<16;x+=8){R(c,x,y,7,3,'#c8c0b0');R(c,x,y+3,8,1,'#988f80');}});
tile('S',c=>{R(c,0,0,16,16,'#f0e0a8');R(c,4,5,1,1,'#d8c088');R(c,11,11,1,1,'#d8c088');R(c,8,2,1,1,'#fff0c8');});
tile('w',c=>{R(c,0,0,16,16,'#c88850');for(let y=0;y<16;y+=4){R(c,0,y+3,16,1,'#a06830');R(c,(y*3)%16,y,1,3,'#a06830');}});
tile('A',c=>{R(c,0,0,16,16,'#e0e0e8');R(c,0,0,16,1,'#c8c8d4');R(c,0,0,1,16,'#c8c8d4');});
tile('M',c=>{R(c,0,0,16,16,'#b83040');R(c,1,1,14,14,'#c84050');R(c,3,3,10,10,'#b83040');});
tile('s',c=>{R(c,0,0,16,16,'#a8a090');R(c,0,7,16,1,'#888070');R(c,7,0,1,7,'#888070');R(c,12,8,1,8,'#888070');});
// solids
tile('T',c=>{grass(c,0);R(c,6,11,4,5,'#805030');R(c,6,11,4,1,K);R(c,1,1,14,11,K);R(c,2,2,12,9,'#309848');R(c,3,3,6,3,'#58c060');R(c,9,7,3,2,'#207838');});
tile('Y',c=>{grass(c,1);R(c,7,1,2,15,'#906838');R(c,7,1,2,15,'#906838');R(c,1,1,6,2,'#38a048');R(c,9,1,6,2,'#38a048');R(c,3,0,10,2,'#48b858');R(c,0,3,4,1,'#38a048');R(c,12,3,4,1,'#38a048');});// palm
tile('Q',c=>{grass(c,0);R(c,6,2,4,14,K);R(c,7,1,2,14,'#286838');R(c,6,4,4,9,'#286838');R(c,7,13,2,3,'#604020');});// cypress
tile('W',c=>{R(c,0,0,16,16,'#3878d0');R(c,2,4,4,1,'#68a8f0');R(c,9,10,5,1,'#68a8f0');R(c,12,3,2,1,'#88c0f8');});
tile('V',c=>{R(c,0,0,16,16,'#3878d0');R(c,0,0,16,4,'#f8f8f8');R(c,0,4,16,1,'#a8d0f8');});// shore foam
tile('B',c=>{R(c,0,0,16,16,'#f0e0c0');R(c,0,15,16,1,'#c8b090');R(c,0,0,1,16,'#d8c8a8');});
tile('b',c=>{R(c,0,0,16,16,'#e8b868');R(c,0,15,16,1,'#c09040');});
tile('O',c=>{R(c,0,0,16,16,'#f0e0c0');R(c,3,3,10,9,K);R(c,4,4,8,7,'#88c8f8');R(c,4,4,3,2,'#c8e8ff');R(c,2,12,12,2,'#806040');});
tile('o',c=>{R(c,0,0,16,16,'#f0e0c0');R(c,3,3,10,9,K);R(c,4,4,8,7,'#f8d070');R(c,4,4,8,2,'#f8e8a0');R(c,2,12,12,2,'#306848');R(c,1,3,2,9,'#306848');R(c,13,3,2,9,'#306848');});// shutters lit

   {id:'irene',sp:'irene',x:15,y:9,dir:'up',lines:[["IRENE", "Forza Lavi! Siamo qui per te."], ["LAVI", "Grazie, Irene."], ["IRENE", "Beh! Mi sembra di aver già vissuto questo momento! Hai raggiunto quest’altro bellissimo traguardo e non posso che essere  felicissima per te. Ma con la differenza, di ciò che ti aspetterà: questo tuo bellissimo viaggio. "], ["IRENE", "Io sarò qui ad aspettarti, ma comunque, ogni giorno, sempre vicina a te. Del resto il nostro rapporto ne é la prova, no?  Riusciamo entrambe a vivere la propria vita senza condivisione quotidiana, ma con la certezza di esserci sempre l’una per l’altra."], ["IRENE", "E quel “sempre” non cambierà certo con qualche chilometro in più di distanza. "], ["IRENE", "I lunghi viaggi sono veri e proprio atti di trasformazione."], ["IRENE", "Incontrerai paesaggi e persone che cambieranno il tuo modo di vedere e leggere il mondo, silenzi che ti faranno ascoltare e capire meglio te stessa e imprevisti che ti scopriranno più forte di quanto pensi. Augurarti che andrà tutto bene è poco: ti auguro piuttosto di vivere ogni istante con presenza e gratitudine, accogliendo tutto ciò che questo viaggio sceglierà di offrirti."], ["IRENE", "Tutto ciò renderà questo tuo cammino indimenticabile."], ["IRENE", "Ti voglio un bene dell’anima. "], ["IRENE", "¡Buen viaje! 🇵🇪"]]},
   {id:'amica',sp:'amica',x:16,y:9,dir:'up',lines:[["BIANCA", "In bocca al lupo, dottoressa!"], ["LAVI", "Crepi!"], ["BIANCA", "Cara Lavi,"], ["BIANCA", "Ormai il momento é arrivato..."], ["BIANCA", "Capisco bene le emozioni che stai provando, non é facile lasciare tutto e tutti per inseguire i propri sogni o semplicemente un'esperienza che ti cambierá la vita!"], ["BIANCA", "Goditi ogni attimo, metti te al centro e vivi, con entusiasmo, energia e apertura verso l'altro."], ["BIANCA", "Farai un viaggio incredibile, non solo alla scoperta di una nuova cultura e posti meravigliosi, ma DENTRO DI TE!"], ["BIANCA", "Saranno le montagne russe più adrenaliniche  della tua vita, goditele e non lasciare a nessuno il potere di inquinare questo momento. Se infatti hai mal di pancia e al minimo pensiero scoppi a piangere é normale,non c'è molto che tu possa fare a riguardo!!!"], ["BIANCA", "Ormai ne abbiamo affrontate tante e ciò che mi rincuora é saperti dalla mia parte. Io farò lo stesso con te, Ci sarò sempre, nonostante il fusorario.."], ["BIANCA", "Siamo una forza e continueremo ad esserlo, dai il meglio di te, non avere paura. Quello che stai facendo vale più di ogni cosa, io sono con te, ormai mi sento in parte responsabile 😂."], ["BIANCA", "Vai libera, sogna e realizza ciò che vuoi, vivi!!!!"], ["BIANCA", "Siempre de tu lado\nBianca"]]},
   {id:'nipotina',sp:'nipotina',x:12,y:9,dir:'up',lines:[['MELISSA','Zia, quest\'anno non ci vedi sciare.'],['LAVI','Lo so. Ma l\'anno prossimo vi trovo cresciuti.']]},
   {id:'nipotino',sp:'nipotino',x:13,y:9,dir:'up',lines:[['NICCOLÒ','Cresciuti tanto?'],['LAVI','Più di me. Non ci vuole molto.']]},

   {id:'adriana',sp:'adriana',x:3,y:10,dir:'up',lines:[['ADRIANA','Ce l\'hai fatta! Sono fierissima di te.'],['ADRIANA','In un solo anno sei diventata parte fondamentale della mia vita e tra un anno sarai di nuovo qui a raccontare i 365 giorni della tua nuova avventura. ¡Cuídate!']]},
   {id:'sharon',sp:'sharon',x:4,y:10,dir:'up',lines:[['SHARON','Dottoressa Sacco! Che emozione!']]},
   {id:'sorella',sp:'sorella',x:6,y:10,dir:'up',lines:[['SORELLA','Brava Lavi! Sono orgogliosa di te.']]},

   {id:'vini_ar',sp:'vini',x:20,y:9,dir:'left',lines:[['VINI','Parabéns, amor! Dottoressa!']]},
   {id:'laura_mis',sp:'laura_mis',x:14,y:10,dir:'up',with:'gianni_mis',lines:[["LAURA", "Cara Lavinia nostra bambina adottiva (vediamo se riesco a scriverti un pensiero speciale per te, sicuramente non sarà facile ma sai già tutto quello che io e Gianni proviamo per te)"], ["LAURA", "Sembra ieri che ti ho vista avvicinarti alla Misericordia poco più che una “bambina” con un cuore grande, con tanta voglia di fare e già determinata nelle tue scelte."], ["GIANNI", "Oggi con gioia immensa vediamo la donna forte e consapevole che sei diventata: una persona speciale!"], ["LAURA", "Il tuo percorso di crescita è stato unico: hai saputo trasformare ogni esperienza, ogni momento (anche se difficile) ogni gioia e ogni problema in un tassello prezioso."], ["GIANNI", "Ora ti attende una nuova sfida grande (della quale ti abbiamo incoraggiato ma…che ci tiene un po’ col fiato corto) un anno in Peru (aspettaci ti verremo a trovare: due girelloni come noi!!!)"], ["LAURA", "Un anno che non sarà solo una nuova esperienza di vita ma un’ulteriore conferma della tua determinazione e, si, della tua generosità verso gli altri. Lì porterai sicuramente la parte migliore di te, imparando al tempo stesso ad affrontare un nuovo mondo: gente, storie e colori diversi (e sa quanto anche a noi piace)."], ["GIANNI", "Parti per questa avventura consapevole di quanta strada hai fatto e di quanto ne potrai fare."], ["LAURA", "Ti auguriamo di vivere ogni singolo giorno con curiosità, coraggio ed entusiasmo che non ti sono mai mancati: sei una persona speciale per noi."], ["GIANNI", "Buon Perù!!! Noi tifiamo per te💪"], ["LAURA", "Un abbraccio fortissimo e a presto 😘"], ["LAURA E GIANNI", "Laura e Gianni"]]},
   {id:'gianni_mis',sp:'gianni_mis',x:15,y:10,dir:'up',lines:[['','Gianni è qui con Laura, per Lavi.']]},

   {id:'mis2',sp:'mis2',x:19,y:10,dir:'up',lines:[['AMICA MISERICORDIA','Congratulazioni dottoressa!']]},
   {id:'ale_ar',sp:'ale',x:18,y:8,dir:'left',lines:[['ALE','Ricordati una cosa.'],['LAVI','Cosa?'],['ALE','Là sono tutti più bassi di te. Per la prima volta nella tua vita sarai alta.'],['LAVI','Quindi?'],['ALE','Quindi regna. Con giudizio.'],['LAVI','Regnerò. Senza giudizio.'],["ALE", "Laviii, sei la mia scoperta più grande di questi ultimi anni."],["ALE", "Con te ho riso e ho pianto, abbiamo litigato e fatto pace. Abbiamo vissuto insieme. Sei per me una persona imprescindibile."],["ALE", "In quest’ultimo periodo hai lavorato così tanto su te stessa che quasi non ti riconosco. Chissà come mi torni dal Perù!"],["ALE", "Sono un po’ spaventato dalla tua partenza, lo ammetto, e preoccupato per te e per come andrà laggiù. Ma basta un fischio e sono subito da te."],["ALE", "Sono sicuro che questa esperienza sia esattamente ciò che ti serve, per te stessa."],["ALE", "E quando tornerai, sicuramente ci sarò io ad aspettarti."]]},
   {id:'gilda_g',sp:'gilda',x:1,y:5,dir:'down',lines:[['GILDA','Buona fortuna in Perù, bella! E congratulazioni per tutto quello che hai costruito. A prestissimo!!!']]},
   {id:'edi_g',sp:'edi',x:2,y:5,dir:'down',lines:[['EDI','Buon viaggio Lavi. Vai in Perù distruggila e torna vincitrice']]},
   {id:'jatniel_g',sp:'jatniel',x:6,y:5,dir:'down',lines:[['JATNIEL','¡Buena suerte en Perú, Lavi! Congratulazioni per tutti i tuoi progressi! A presto!!!']]},
   {id:'antonella_g',sp:'antonella',x:7,y:5,dir:'down',lines:[['ANTONELLA','Lavi, buona fortuna per tutto in Perù! Congratulazioni per tutti i tuoi traguardi. A presto!!!']]},
   {id:'roberto_g',sp:'roberto',x:8,y:5,dir:'down',lines:[['ROBERTO','Buona fortuna per tutto in Perù, Lavi. E congratulazioni per tutti i tuoi progressi. A presto!']]},
   {id:'saadi_g',sp:'saadi',x:11,y:5,dir:'down',lines:[
    ['SAADI','Ma davvero mi lasci qui da solo/a con 500 posate ancora da impacchettare?!'],
    ['LAVI','Sì, e mi porto via anche l\'unico cavatappi decente del locale.'],
    ['SAADI','Traditrice! Abbiamo sopravvissuto insieme al brunch della Festa della Mamma! Come puoi abbandonarmi?'],
    ['LAVI','Facilissimo. Ho trovato un lavoro dove la gente non chiede se l\'acqua del rubinetto è senza glutine.'],
    ['SAADI','Portami con te! Entro benissimo nel tuo zaino!'],
    ['LAVI','Sei troppo alto/a. Però ti lascio in eredità ufficiale il nostro posto segreto nella cella frigorifera dove andiamo a piangere.'],
    ['SAADI','..,È il regalo di addio più bello di sempre.'],
    ['LAVI','Lo so. Ora abbracciami prima che il Tavolo 3 chieda di nuovo altra salsa ranch.'],
    ['SAADI','Ci sto. Mi mancherai, sorellina.'],
    ['LAVI','Anche tu, scemo/a! Ora corri, il Tavolo 3 ti sta chiamando!']]},

function wrap(text,max=26){if(text.includes('\n'))return text.split('\n').flatMap(x=>wrap(x,max));const words=text.split(' ');const lines=[];let cur='';for(const w of words){if((cur+' '+w).trim().length>max){lines.push(cur.trim());cur=w;}else cur+=' '+w;}if(cur.trim())lines.push(cur.trim());return lines;}

function dlgAdvance(){if(!dlg)return;const pg=dlg.pages[dlg.pi];const total=pg[0].length+pg[1].length;if(dlg.ci<total){dlg.ci=total;return;}dlg.pi++;dlg.ci=0;dlg.acc=0;sfx('blip');if(dlg.pi>=dlg.pages.length){const cb=dlg.onEnd;dlg=null;mode=scriptRunning?'script':'play';if(cb)cb();}}

  if(mode==='chapters'){if(b==='A'){if(chSel===CHAPTERS.length){mode='dex';sfx('blip');}else if(chSel===CHAPTERS.length+1){mode='medals';sfx('blip');}else startChapter(CHAPTERS[chSel][1]);}else mode='title';return;}
  if(mode==='medals'){if(b==='B')mode='chapters';return;}
  if(mode==='medalShow'){if(medalShow.t>0.8)endMedalShow();return;}
  if(mode==='anim'){if(anim.t>2)endAnim();return;}
  if(mode==='match'){if(b==='A')shoot();if(b==='B')passBall();return;}
  if(mode==='dex'){if(b==='B')mode='chapters';else{dexSel=(dexSel+1)%DEX.length;sfx('blip');}return;}if(mode==='end')return;
  if(mode==='card'){if(cardT>0.5)endCard();return;}
  if(mode==='dialog'){dlgAdvance();return;}
  if(mode==='menu'){if(b==='A'&&menu.t>0.2)menuConfirm();return;}
  if(mode==='choice'){if(b==='A'&&choice.t>0.25)choiceConfirm();return;}
  if(mode==='timing'){if(b==='A')timingPress();return;}
  if(mode==='play'&&b==='A'&&!pl.moving)interact();}
function front(){const d=DV[pl.dir];return[pl.x+d[0],pl.y+d[1]];}
function interact(){const [fx,fy]=front();let n=npcAt(fx,fy);if(!n&&'{$k'.includes(tileAt(fx,fy))&&!(SV.on&&'{$'.includes(tileAt(fx,fy)))){const d=DV[pl.dir];const n2=npcAt(fx+d[0],fy+d[1]);if(n2&&!(n2.client&&SV.on&&n2.st==='cassa'))n=n2;}talker=n||null;
  if(n){if(n.sp==='LLAMA')markSeen('LAMA');if(n.sp==='DOG')markSeen('ATENA');if(n.client){serviceTalk(n);return true;}if(questInteract('npc',n))return true;
    if(!n.dance)n.dir=OPP[pl.dir];
    if(n.script){runScript(SCRIPTS[n.script]);return true;}
    talked.add(map.key+n.id);openDialog(n.lines,()=>afterTalk(n));return true;}
  const p=petAt(fx,fy);if(p&&p.kind==='turtle')markSeen('TARTARUGHE');if(p&&questInteract('pet',p))return true;if(p&&p.kind==='pigeon'){openDialog([['','Un piccione fiorentino. Ha visto più turisti di te. Non si sposta.']]);return true;}if(p){markSeen(p.kind==='cat'?'GATTO GRIGIO':'TARTARUGHE');openDialog([['',p.kind==='cat'?CAT_TXT:TURTLE_TXT]]);return true;}
  const tc=tileAt(fx,fy);if(questInteract('tile',{x:fx,y:fy}))return true;
  if(SV.on&&tc==='{')return pickPlate();
  if(SV.on&&tc==='$')return openCassa();
  const sg=(map.signs||[]).find(s=>s.x===fx&&s.y===fy);if(sg){if(sg.place)visitPlace(sg.place);if(sg.act){sg.act(sg);return true;}openDialog([['',sg.text]]);return true;}return false;}
function afterTalk(n){if(n.turnAway)n.dir='up';if(n.leaveAfter&&!n.left){n.left=true;walkNpc(n,SVC.exitTo[0],SVC.exitTo[1],()=>{n.gone=true;});}
  if(map.onAllTalked&&!map._all&&staff().every(m=>talked.has(map.key+m.id))){map._all=true;openDialog(map.onAllTalked);}}
function staff(){return map.npcs.filter(n=>!n.client&&!n.amb);}

// ---------- npc movement ----------
function npcPath(n,tx,ty,avoid){const key=(x,y)=>x+','+y;const prev=new Map([[key(n.x,n.y),null]]);const q=[[n.x,n.y]];
  while(q.length){const[x,y]=q.shift();if(x===tx&&y===ty){const path=[];let c=key(x,y);while(prev.get(c)){const[px,py,d]=prev.get(c);path.unshift(d);c=key(px,py);}return path;}
    for(const d of['up','down','left','right']){const nx=x+DV[d][0],ny=y+DV[d][1],k=key(nx,ny);if(prev.has(k))continue;const goal=nx===tx&&ny===ty;
      if(!goal&&isSolidT(tileAt(nx,ny)))continue;if(avoid&&!goal&&map.npcs.some(o=>o!==n&&!o.gone&&o.x===nx&&o.y===ny))continue;prev.set(k,[x,y,d]);q.push([nx,ny]);}}return null;}
function walkNpc(n,tx,ty,cb){n.path=npcPath(n,tx,ty)||[];n.goal=[tx,ty];n.onArrive=cb;n.wait=0;}
function updNpc(n,dt){if(n.gone)return;if(n.emote){n.emote.t-=dt;if(n.emote.t<=0)n.emote=null;}
  if(n.moving){n.mt+=dt;const k=Math.min(1,n.mt/(STEP*1.5));n.px=(n.fx+(n.x-n.fx)*k)*TS;n.py=(n.fy+(n.y-n.fy)*k)*TS;if(k>=1){n.moving=false;n.px=n.x*TS;n.py=n.y*TS;}return;}
  if(n.path&&n.path.length){const d=n.path[0];const nx=n.x+DV[d][0],ny=n.y+DV[d][1];n.dir=d;
    const blocked=(pl.x===nx&&pl.y===ny)||map.npcs.some(o=>o!==n&&!o.gone&&o.x===nx&&o.y===ny)||petAt(nx,ny);
    if(blocked){n.wait+=dt;n.stuck=(n.stuck||0)+dt;if(n.stuck<2.2){if(n.wait>1.0){n.wait=0;const p=npcPath(n,n.goal[0],n.goal[1],true);if(p)n.path=p;}return;}}n.stuck=0;
    n.path.shift();n.fx=n.x;n.fy=n.y;n.x=nx;n.y=ny;n.moving=true;n.mt=0;n.frame++;n.wait=0;}
  else if(n.onArrive){const cb=n.onArrive;n.onArrive=null;cb();}}
function updPets(dt){pets.forEach(p=>{if(map.sleepTurtles&&p.kind==='turtle')return;const sp=p.kind==='turtle'?0.7:p.kind==='pigeon'?0.18:0.22;
  if(p.moving){p.mt+=dt;const k=Math.min(1,p.mt/sp);p.px=(p.fx+(p.x-p.fx)*k)*TS;p.py=(p.fy+(p.y-p.fy)*k)*TS;if(k>=1){p.moving=false;p.px=p.x*TS;p.py=p.y*TS;}return;}
  p.cd-=dt;if(p.kind==='pigeon'&&Math.abs(p.x-pl.x)+Math.abs(p.y-pl.y)<=1)p.cd=0;if(p.cd>0)return;p.cd=(p.kind==='turtle'?1.5:p.kind==='pigeon'?0.4:0.6)+Math.random()*2.5;
  const d=['up','down','left','right'][Math.random()*4|0];const nx=p.x+DV[d][0],ny=p.y+DV[d][1];const[a,b,c,e]=p.area;
  if(nx<a||ny<b||nx>c||ny>e||solidAt(nx,ny)||(pl.x===nx&&pl.y===ny)||followers.some(f=>f.x===nx&&f.y===ny))return;
  p.dir=d==='up'||d==='down'?p.dir:d;p.fx=p.x;p.fy=p.y;p.x=nx;p.y=ny;p.moving=true;p.mt=0;});}

// ---------- the service ----------
function spawnClient(){const c=CLIENTS[SV.next++];const n=makeNpc({id:'cl'+SV.next,sp:c.sp,x:SVC.door[0],y:SVC.door[1],dir:'up'});n.client=c;n.st='enter';n.tbl=c.t;map.npcs.push(n);
  walkNpc(n,c.seat[0],c.seat[1],()=>{n.st='order';n.dir=(n.client&&n.client.face)||'up';sfx('ding');});sfx('door');}

function relayQueue(){SV.queue.forEach((n,i)=>{const s=SVC.cq[Math.min(i,SVC.cq.length-1)];if(n.goal&&n.goal[0]===s[0]&&n.goal[1]===s[1]&&(n.path.length||n.st==='cassa'))return;
  walkNpc(n,s[0],s[1],()=>{n.dir=SVC.cqDir(i);if(SV.queue[0]===n&&n.st!=='cassa'){n.st='cassa';n.payT=0;sfx('ding');toast('TAVOLO '+n.tbl+': IL CONTO!');}});});}
function updService(dt){if(!SV.on)return;
  SV.spawnT-=dt;if(SV.next<CLIENTS.length&&SV.spawnT<=0&&!(pl.x===SVC.door[0]&&pl.y===SVC.door[1])&&!npcAt(SVC.door[0],SVC.door[1])){spawnClient();SV.spawnT=SV.next===1?4:7;}
  map.npcs.forEach(n=>{if(!n.client||n.gone)return;
    if(n.st==='cook'){n.timer-=dt;if(n.timer<=0){n.st='ready';SV.ready.push(n);sfx('ding');toast('EDI: TAVOLO '+n.tbl+' PRONTO!');}}
    else if(n.st==='eat'){n.timer-=dt;if(n.timer<=0){n.st='toCassa';SV.queue.push(n);relayQueue();}}});
  if(SV.cashier==='gilda'){const q=map.npcs.find(n=>n.client&&!n.gone&&n.st==='cassa');if(q){q.payT=(q.payT||0)+dt;if(q.payT>1.5){const tot=q.client.bill.reduce((a,b)=>a+b[1],0);SV.cash+=tot;SV.tips+=q.client.tip;sfx('cash');toast('GILDA INCASSA IL TAVOLO '+q.tbl);clientLeave(q);}}
    else if(SV.served>=2&&!SV.pause&&!map.npcs.some(n=>n.client&&!n.gone&&n.st==='toCassa')){SV.pause=true;gildaPause();return;}}
  const atCassa=SVC.atCassa();const work=SV.carry||SV.ready.length||map.npcs.some(n=>n.client&&!n.gone&&n.st==='order');
  if(SV.cashier==='lavi'&&atCassa&&work){SV.cassaT+=dt;if(SV.cassaT>4&&SV.nags<NAGS.length){SV.cassaT=0;openDialog(NAGS[SV.nags++]);}}else SV.cassaT=Math.max(0,SV.cassaT-dt*0.5);}
function gildaPause(){const g=npc('gilda');openDialog([['GILDA','Lavi, vado in pausa dieci minuti. La cassa è tua.'],['LAVI','Finalmente. Casa mia.'],['GILDA','Però la sala non si serve da sola. Non ti ci affezionare.'],['','Ora sei tu in CASSA: quando un cliente chiede il conto, vai alla cassa e scegli il totale giusto.']],()=>{SV.cashier='lavi';if(g){g.left=true;walkNpc(g,SVC.exitTo[0],SVC.exitTo[1],()=>{g.gone=true;});}});}
function serviceTalk(n){const c=n.client;n.dir=OPP[pl.dir];
  if(SV.carry===n){SV.carry=null;n.st='eat';n.timer=4.5;sfx('ding');openDialog(c.served,()=>{n.dir=(n.client&&n.client.face)||'up';toast('BUON APPETITO');});return true;}
  if(SV.carry&&n.st==='ready'){toast('QUESTO È DEL TAVOLO '+SV.carry.tbl+'!');n.dir=(n.client&&n.client.face)||'up';return true;}
  if(n.st==='order'){openDialog(c.order,()=>{n.st='cook';n.timer=3.5;n.dir=(n.client&&n.client.face)||'up';toast('COMANDA IN CUCINA');});return true;}
  if(n.st==='cook'||n.st==='ready'){openDialog([[c.name,'Arriva?'],['LAVI',n.st==='ready'?'È pronto al passe. Due secondi.':'Sta uscendo dalla cucina.']],()=>n.dir=(n.client&&n.client.face)||'up');return true;}
  if(n.st==='eat'){toast('STA MANGIANDO. LASCIALO IN PACE.');n.dir=(n.client&&n.client.face)||'up';return true;}
  if(n.st==='cassa'){if(SV.cashier==='gilda'){toast('CI PENSA GILDA');return true;}return openCassa();}
  toast('SI STA ANCORA SEDENDO.');return true;}
function pickPlate(){if(SV.carry){toast('HAI GIÀ LE MANI PIENE.');return true;}
  if(!SV.ready.length){openDialog([['EDI','Non c\'è niente. Torna quando chiamo.']]);return true;}
  SV.carry=SV.ready.shift();SV.carry.st='ready';sfx('blip');toast('TAVOLO '+SV.carry.tbl+' - VIA!');return true;}
function openCassa(){if(SV.cashier==='gilda'){openDialog([['GILDA','La cassa è mia, bella. Tu giri in sala.'],['LAVI','Uffa.']]);return true;}const n=map.npcs.find(x=>x.client&&!x.gone&&x.st==='cassa');
  if(!n){openDialog([['LAVI','Cassa vuota. Che pace. Potrei stare qui tutta la sera.']]);return true;}openMenu(n);return true;}
function openMenu(n){const c=n.client;const tot=c.bill.reduce((a,b)=>a+b[1],0);const cop=(c.bill.find(b=>/Coperto/.test(b[0]))||[0,5])[1];
  const raw=[tot,tot-cop,tot+10];const r=n.tbl%3;const opts=raw.slice(r).concat(raw.slice(0,r));menu={n,tot,opts,sel:0,t:0};mode='menu';sfx('blip');}
function menuConfirm(){const m=menu;const v=m.opts[m.sel];menu=null;mode='play';const c=m.n.client;
  if(v===m.tot){SV.cash+=m.tot;SV.tips+=c.tip;sfx('cash');openDialog(c.pay,()=>{toast(c.tip?'+'+c.tip+' EURO DI MANCIA':'NIENTE MANCIA. COME SEMPRE.');clientLeave(m.n);});}
  else openDialog([[c.name,v<m.tot?'Mi sa che ha dimenticato qualcosa.':'Scusi, '+v+'? Mi sembra tanto.'],['LAVI','...Rifaccio il conto.']],()=>openMenu(m.n));}
function clientLeave(n){n.st='leave';SV.served++;SV.queue=SV.queue.filter(q=>q!==n);relayQueue();walkNpc(n,SVC.exitTo[0],SVC.exitTo[1],()=>{n.gone=true;checkDone();});}
function checkDone(){if(SV.served<CLIENTS.length||map.npcs.some(n=>n.client&&!n.gone))return;SV.done=true;SV.on=false;const g=npc('gilda');if(g){g.gone=false;g.x=SVC.gildaHome[0];g.y=SVC.gildaHome[1];g.px=g.x*TS;g.py=g.y*TS;g.dir=SVC.gildaHome[2];g.path=[];g.left=false;}
  openDialog([['','Ultimo cliente uscito. Saracinesca a metà.'],['GILDA','Sono tornata! Lavi, esci dalla cassa.'],['LAVI','No. Ormai è casa mia.'],['GILDA','Incasso: '+SV.cash+' euro. Mance: '+SV.tips+'. E sei pure uscita in sala. Brava.'],['LAVI','Non abituatevi.'],['','Prima di andare a casa, due chiacchiere con lo staff.']],()=>giveMedal('grotta',()=>{if(SVC.onDone)SVC.onDone();}));}

function objective(){if(!SV.on){if(!questDone())return questTarget();const e=map.endAt||(map.exits||[]).find(x=>exitOpen(x)&&!x.noAuto);return e&&map.quest?{txt:'',x:e.x,y:e.y}:null;}const cl=map.npcs.filter(n=>n.client&&!n.gone);
  if(SV.cashier==='lavi'){const q=cl.find(n=>n.st==='cassa');if(q)return{txt:'CASSA: CONTO TAVOLO '+q.tbl,x:SVC.cassaObj[0],y:SVC.cassaObj[1]};}
  if(SV.carry)return{txt:'PORTA IL PIATTO AL TAVOLO '+SV.carry.tbl,x:SV.carry.x,y:SV.carry.y};
  if(SV.ready.length)return{txt:'PASSE: PIATTO DEL TAVOLO '+SV.ready[0].tbl,x:SVC.passeObj[0],y:SVC.passeObj[1]};
  const o=cl.find(n=>n.st==='order');if(o)return{txt:'TAVOLO '+o.tbl+': PRENDI LA COMANDA',x:o.x,y:o.y};
  if(cl.some(n=>n.st==='cook'))return{txt:'LA CUCINA STA PREPARANDO...'};
  if(cl.some(n=>n.st==='enter'))return{txt:'ARRIVA UN CLIENTE',x:SVC.door[0],y:SVC.door[1]};
  if(cl.some(n=>n.st==='eat'))return{txt:'I TAVOLI MANGIANO. RESPIRA.'};
  if(cl.some(n=>n.st==='toCassa'||n.st==='cassa'))return{txt:SV.cashier==='gilda'?'GILDA FA IL CONTO':'UN CLIENTE VA IN CASSA'};
  return{txt:'ASPETTA IL PROSSIMO CLIENTE'};}

function tryMove(dir){pl.dir=dir;const nx=pl.x+DV[dir][0],ny=pl.y+DV[dir][1];const ex=exitAt(nx,ny);

  followers.forEach(f=>{const old=[f.x,f.y];if(old[0]!==prev[0]||old[1]!==prev[1]){f.fx=f.x;f.fy=f.y;f.dir=prev[0]>f.x?'right':prev[0]<f.x?'left':prev[1]>f.y?'down':'up';f.x=prev[0];f.y=prev[1];f.moving=true;}prev=old;});
  return true;}

function adjGoals(n,G){for(const[dx,dy,face]of[[0,1,'up'],[-1,0,'right'],[1,0,'left'],[0,-1,'down']]){G.push({x:n.x+dx,y:n.y+dy,face,act:true});if('{$k'.includes(tileAt(n.x+dx,n.y+dy)))G.push({x:n.x+2*dx,y:n.y+2*dy,face,act:true});}}
function serviceGoals(){const G=[];const cl=map.npcs.filter(n=>n.client&&!n.gone);
  if(SV.cashier==='lavi'&&cl.some(n=>n.st==='cassa')){G.push({...SVC.cassaStand,act:true});return G;}
  if(SV.carry){adjGoals(SV.carry,G);return G;}
  if(SV.ready.length){SVC.passeStands.forEach(s=>G.push({...s,act:true}));return G;}
  cl.filter(n=>n.st==='order').forEach(n=>adjGoals(n,G));return G;}
function nextTarget(){if(SV.on){const g=serviceGoals();if(g.length)return g;}if(!questDone()){const q=questGoals();if(q.length)return q;if(Q().auto)return[];}
  const pending=staff().filter(n=>!n.gone&&!n.left&&!talked.has(map.key+n.id));const G=[];
  if(pending.length){pending.forEach(n=>adjGoals(n,G));return G;}
  if(SV.on)return[SVC.idle];
  if(map.endAt)G.push({x:map.endAt.x,y:map.endAt.y});
  (map.exits||[]).filter(e=>exitOpen(e)&&!e.noAuto).forEach(e=>G.push({x:e.x,y:e.y}));return G;}
function bfs(goals){const key=(x,y)=>x+','+y;const gset=new Map(goals.map(g=>[key(g.x,g.y),g]));const q=[[pl.x,pl.y]];const prev=new Map([[key(pl.x,pl.y),null]]);
  if(gset.has(key(pl.x,pl.y)))return{path:[],goal:gset.get(key(pl.x,pl.y))};
  while(q.length){const[x,y]=q.shift();for(const d of['up','down','left','right']){const nx=x+DV[d][0],ny=y+DV[d][1],k=key(nx,ny);if(prev.has(k))continue;
    const ex=exitAt(nx,ny);if(ex?!exitOpen(ex):solidAt(nx,ny))continue;if(ex&&ex.noAuto&&!gset.has(k))continue;prev.set(k,[x,y,d]);
    if(gset.has(k)){const path=[];let c=k;while(prev.get(c)){const[px,py,dd]=prev.get(c);path.unshift(dd);c=key(px,py);}return{path,goal:gset.get(k)};}q.push([nx,ny]);}}return null;}
function autoStep(){const goals=nextTarget();if(!goals.length)return;const r=bfs(goals);if(!r)return;
  if(r.path.length===0){if(r.goal.face)pl.dir=r.goal.face;if(r.goal.act)interact();return;}tryMove(r.path[0]);}
